# ============================================
# Импорт статистики игроков.
# ============================================
#
# Файл читается ОДИН РАЗ при старте Sovereignty.
# Данные вливаются в БД только если:
#   - игрока ещё нет в таблице player_stats, ИЛИ
#   - first_seen = 0, ИЛИ
#   - импортируемое значение "старше" / "больше" текущего.
#
# UUID вычисляется как offline-UUID от ника
# (Bukkit использует тот же формат для пираток).
#
# Формат времени first_seen: epoch milliseconds (UTC).
# Формат playtime_seconds: секунды игры (целое).
#
# Можно оставить файл пустым (players: {}) — импорт просто пропустится.
# ============================================

