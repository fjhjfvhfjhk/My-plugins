# Конфигурация аукционного плагина

# Время аукциона по умолчанию (в минутах), если игрок не указал
default-auction-time: 60

# Максимальное время аукциона (в минутах)
max-auction-time: 180

# Комиссия сервера (в процентах от финальной цены). 0 = без комиссии
commission-percent: 0

# Минимальная начальная цена (если игрок укажет меньше, будет установлена эта)
min-start-price: 10

# Сообщения
messages:
  auction-created: "§aАукцион #%id% создан! Предмет: %item%, начальная цена: %price%, время: %time% мин."
  auction-ended: "§6Аукцион #%id% завершён! Победитель: %winner%, цена: %price%."
  auction-cancelled: "§cАукцион #%id% отменён продавцом."
  auction-no-bids: "§cНа аукцион #%id% не было ставок, предмет возвращён продавцу."
  bid-placed: "§aВы сделали ставку %price% на аукцион #%id%!"
  bid-outbid: "§cВашу ставку на аукцион #%id% перебили! Новая цена: %price%."
  insufficient-money: "§cНедостаточно денег. Нужно: %need%."
  insufficient-items: "§cНедостаточно предметов. Нужно: %amount% × %material%."
  cannot-bid-own: "§cВы не можете делать ставки на свой аукцион."
  auction-not-found: "§cАукцион не найден."
  auction-ended-already: "§cАукцион уже завершён."
  auction-cancel-no-bids: "§cВы можете отменить аукцион только если на него нет ставок."
  wrong-item: "§cВ руке должен быть предмет."
  invalid-time: "§cВремя должно быть от 1 до %max% минут."
  invalid-price: "§cЦена должна быть положительным числом не менее %min%."
